# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-noetic-mrt-cmake-modules
  version: 1.0.11
source:
  git: https://github.com/KIT-MRT/mrt_cmake_modules-release.git
  tag: release/noetic/mrt_cmake_modules/1.0.11-1
  target_directory: ros-noetic-mrt-cmake-modules/src/work
  patches:
    - patch/ros-noetic-mrt-cmake-modules.patch

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 24
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/KIT-MRT/mrt_cmake_modules.git
  homepage: http://wiki.ros.org/mrt_cmake_modules
  license: BSD-3-Clause
  summary: CMake Functions and Modules for automating CMake
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - catkin_pkg
    - lcov
    - numpy
    - pip
    - python
    - pyyaml
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-catkin
    - ros-noetic-ros-environment
    - rospkg
    - setuptools
  run:
    - catkin_pkg
    - lcov
    - python
    - pyyaml
    - ros-distro-mutex 0.7.* noetic_*
    - ros-noetic-ros-environment
    - rospkg
    - setuptools
